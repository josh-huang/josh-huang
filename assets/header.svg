<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" role="img" aria-label="Animated banner">
  <style>
    .edge  { stroke: #ffffff; stroke-opacity: .22; stroke-width: 1.2; }
    .pulse { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-opacity: .95;
             stroke-dashoffset: var(--len); animation: travel 3.2s linear infinite; }
    .node  { fill: #ffffff; animation: glow 2.4s ease-in-out infinite; }
    @keyframes travel { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
    @keyframes glow   { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e75b6">
        <animate attributeName="stop-color" values="#0e75b6;#7b5cff;#00c2d1;#0e75b6" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7b5cff">
        <animate attributeName="stop-color" values="#7b5cff;#00c2d1;#0e75b6;#7b5cff" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
